<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>練習 02：星際防衛戰海報（CSS 排版練習）</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <article class="poster">
    <div class="kicker">ARCADE EDITION · 2026</div>
    <h1>星際防衛戰</h1>
    <p class="desc">
      駕駛你的光速太空船，在 30 秒隕石風暴中接住能量核心、閃避紅色炸彈，挑戰全班最高分紀錄！
    </p>
    <div class="stats">
      <div class="stat-box">
        <span class="label">TIME LIMIT</span>
        <strong>30 SEC</strong>
      </div>
      <div class="stat-box">
        <span class="label">HIGH SCORE</span>
        <strong>1,250</strong>
      </div>
    </div>
    <button type="button" class="start-btn">投幣開始遊戲</button>
  </article>
</body>
</html>
