<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>練習 01：玩家檔案卡（HTML 基礎）</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="card">
    <div class="badge">PLAYER CARD · LEVEL 01</div>

    <!-- 任務 1：下面這行 <h1> 忘記寫結束標籤 </h1> 了！請補上 </h1> 並把「新手玩家」改成你的名字或暱稱 -->
    <h1>新手玩家

    <!-- 任務 2：請在下面新增一個 <p>...</p> 段落，寫一句話介紹你最喜歡的一款遊戲 -->


    <h2>我的遊戲技能樹</h2>
    <ul>
      <li>看懂 HTML 網頁骨架</li>
      <li>使用瀏覽器即時預覽畫面</li>
      <!-- 任務 3：請在下面多加第 3 個 <li>...</li> 清單項目（例如：設計好玩的關卡） -->

    </ul>

    <!-- 任務 4：請在下面加入一顆 <button>...</button> 按鈕，按鈕文字寫「開始挑戰」 -->

  </main>

</html>
